<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boa Garota</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .logo {
      max-width: 100%;
      height: auto;
    }
    .card-img-top {
      height: 400px;
      object-fit: cover;
    }
    .footer {
      background-color: #f8f9fa;
      padding: 20px;
      text-align: center;
      margin-top: 50px;
    }
  </style>
</head>

<body>

  <!-- Banner -->
  <div class="container text-center mt-4">
    <img src="banner.jpeg" class="logo" alt="Banner do site">
  </div>

  <!-- Menu de Navegação -->
  <nav class="navbar navbar-expand-lg navbar-light bg-primary mt-3 mb-4">
    <div class="container">
      <a class="navbar-brand text-white" href="#">Resenhas de Boa Garota</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link text-white" href="#">Início</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white" href="#">Resenhas</a>
          </li>
        </ul>
        <!-- Espaço para dropdown no futuro -->
      </div>
    </div>
  </nav>

  <!-- Cartões de Livros -->
  <div class="container">
    <div class="row row-cols-1 row-cols-md-2 g-4">

      <!-- Livro 1 -->
      <div class="col">
        <a href="./manual de assasinato/index.html" class="text-decoration-none text-dark">
          <div class="card h-100">
            <img src="../../imagens/manualdeassasinato.jpg" class="card-img-top" alt="Capa do livro O Verão que Mudou Minha Vida">
            <div class="card-body text-center">
              <h5 class="card-title">Manual de Assassinato para boas garotas</h5>
              <p class="card-text">Clique para ler a resenha completa!</p>
            </div>
          </div>
        </a>
      </div>

      <!-- Livro 2 -->
      <div class="col">
        <a href="./Nunca mais/index.html" class="text-decoration-none text-dark">
          <div class="card h-100">
            <img src="../../imagens/nunca.jpg" class="card-img-top" alt="Capa do livro Sem Você Não É Verão">
            <div class="card-body text-center">
              <h5 class="card-title">Boa garota nunca mais</h5>
              <p class="card-text">Clique para ler a resenha completa!</p>
            </div>
          </div>
        </a>
      </div>

      <!-- Livro 3 -->
      <div class="col">
        <a href="./segredo mortal/index.html" class="text-decoration-none text-dark">
          <div class="card h-100">
            <img src="../../imagens/livrovermelho.jpg" class="card-img-top" style="height:500px;" alt="Capa do livro Sempre Teremos o Verão">
            <div class="card-body text-center">
              <h5 class="card-title">Segredo Mortal</h5>
              <p class="card-text">Clique para ler a resenha completa!</p>
            </div>
          </div>
        </a>
      </div>

    </div>
  </div>

  <!-- Rodapé -->
  <div class="footer">
    <p>Site de Resenhas © 2025</p>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
