<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Manual de Assassinato para Boas Garotas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .logo {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
    }
    blockquote {
      font-style: italic;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<!-- Banner -->
<div class="container-fluid p-0">
  <img src="./imagens/banner.jpeg" class="logo img-fluid" alt="Banner">
</div>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">Resenhas</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="#">Listas</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Novidades</a></li>
      </ul>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#">Redes sociais</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Conteúdo principal -->
<div class="container my-5">
  <div class="card shadow-sm">
    <div class="card-body text-center">
      <h2 class="card-title">Manual de Assassinato para Boas Garotas</h2>
      <img src="../../../imagens/manualdeassasinato.jpg" class="img-fluid my-3" style="max-width: 600px;" alt="Capa do livro">
      <blockquote class="blockquote">
        Após Andie Bell ser assassinada, Pip decide investigar o caso como seu projeto de curso. Mas segredos obscuros vêm à tona…
      </blockquote>
      <div id="resenha-content" class="text-start mt-4"></div>
    </div>
  </div>

  <!-- Área de edição -->
  <div class="card shadow-sm mt-4">
    <div class="card-body">
      <h5 class="card-title">Editar Resenha</h5>
      <textarea id="review-text" class="form-control mb-3" rows="6"></textarea>
      <div class="d-flex justify-content-end gap-2">
        <button id="edit-btn" class="btn btn-secondary">Editar</button>
        <button id="save-btn" class="btn btn-primary">Salvar</button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script de resenha -->
<script>
  const resenhaContent = document.getElementById("resenha-content");
  const textarea = document.getElementById("review-text");
  const editBtn = document.getElementById("edit-btn");
  const saveBtn = document.getElementById("save-btn");

  let textoSalvo = localStorage.getItem("resenhaManual") || "";
  resenhaContent.innerText = textoSalvo;

  editBtn.onclick = () => {
    textarea.value = textoSalvo;
  };

  saveBtn.onclick = () => {
    textoSalvo = textarea.value;
    resenhaContent.innerText = textoSalvo;
    localStorage.setItem("resenhaManual", textoSalvo);
  };
</script>

</body>
</html>
