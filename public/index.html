<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resenhas Literárias</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Firebase Scripts (mantidos) -->
  <script defer src="/__/firebase/11.8.1/firebase-app-compat.js"></script>
  <script defer src="/__/firebase/11.8.1/firebase-auth-compat.js"></script>
  <script defer src="/__/firebase/11.8.1/firebase-database-compat.js"></script>
  <script defer src="/__/firebase/11.8.1/firebase-firestore-compat.js"></script>
  <script defer src="/__/firebase/11.8.1/firebase-functions-compat.js"></script>
  <script defer src="/__/firebase/11.8.1/firebase-messaging-compat.js"></script>
  <script defer src="/__/firebase/11.8.1/firebase-storage-compat.js"></script>
  <script defer src="/__/firebase/11.8.1/firebase-analytics-compat.js"></script>
  <script defer src="/__/firebase/11.8.1/firebase-remote-config-compat.js"></script>
  <script defer src="/__/firebase/11.8.1/firebase-performance-compat.js"></script>
  <script defer src="/__/firebase/init.js?useEmulator=true"></script>

  <style>
    body {
      background-color: #f8f9fa;
    }

    .navbar-brand img {
      height: 60px;
    }

    .card-img-top {
      height: 300px;
      object-fit: cover;
    }

    .card:hover {
      transform: scale(1.02);
      transition: transform 0.3s;
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-info">
    <div class="container">
      <a class="navbar-brand" href="#">
        <img src="./imagens/banner.jpeg" alt="Banner">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="#">Início</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Resenhas</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Redes Sociais</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Conteúdo principal -->
  <div class="container my-4">
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
      <!-- Card 1 -->
      <div class="col">
        <a href="./paginas principais/boagarota/" class="text-decoration-none text-dark">
          <div class="card h-100">
            <img src="./imagens/manualdeassasinato.jpg" class="card-img-top" alt="Manual de Assassinato">
            <div class="card-body">
              <h5 class="card-title">Manual de Assassinato para Boas Garotas</h5>
              <p class="card-text">Clique para ler mais!</p>
            </div>
          </div>
        </a>
      </div>

      <!-- Card 2 -->
      <div class="col">
        <a href="./paginas principais/percyjackson/" class="text-decoration-none text-dark">
          <div class="card h-100">
            <img src="./imagens/jackson1.jpeg" class="card-img-top" alt="Segredo Mortal">
            <div class="card-body">
              <h5 class="card-title">Percy Jackson</h5>
              <p class="card-text">Clique para ler mais!</p>
            </div>
          </div>
        </a>
      </div>

      <!-- Card 3 -->
      <div class="col">
        <a href="./paginas principais/verao/" class="text-decoration-none text-dark">
          <div class="card h-100">
            <img src="./imagens/verao.jpeg" class="card-img-top" alt="Nunca Mais">
            <div class="card-body">
              <h5 class="card-title">Resenhas de Verão</h5>
              <p class="card-text">Clique para ler mais!</p>
            </div>
          </div>
        </a>
      </div>


    </div>
  </div>

  <!-- Rodapé -->
  <footer class="bg-dark text-white text-center py-3">
    <div class="container">
      <p class="mb-0">&copy; 2025 Resenhas Literárias. Todos os direitos reservados.</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
